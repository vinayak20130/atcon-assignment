packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  prisma: true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  '@parcel/watcher': true
  '@scarf/scarf': false
  msgpackr-extract: true
  unrs-resolver: true
  # Cloudflare's runtime, pulled in transitively by vitest. Not used here.
  workerd: false
