# Local development stack.
#
# Services are added as the code that needs them is written, rather than
# provisioned up front. Redis arrives with the queue, MinIO with file upload,
# Mailpit with notifications.
name: atcon-assignment

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atcon
      POSTGRES_PASSWORD: atcon
      POSTGRES_DB: atcon_assignment
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres briefly accepts then drops connections during init, so wait
      # for a real ready signal rather than a port check.
      test: ['CMD-SHELL', 'pg_isready -U atcon -d atcon_assignment']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so queued-but-not-yet-run jobs survive a container restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # 1025 is SMTP for the worker; 8025 is the web inbox to read what it sent.
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
